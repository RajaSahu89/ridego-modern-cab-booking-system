databases:
  - name: ridego-db
    plan: free
    databaseName: ridego
    user: ridego

services:
  - type: web
    name: ridego-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ridego-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false 
      - key: PORT
        value: 4000
