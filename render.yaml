# Render "Blueprint" — deploys the backend automatically from this repo.
# In Render: New -> Blueprint -> pick this repo -> it reads this file.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: ridego-db
    plan: free
    databaseName: ridego
    user: ridego

services:
  - type: web
    name: ridego-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ridego-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # set this to your deployed frontend URL (e.g. https://ridego.vercel.app) after you deploy it
      - key: PORT
        value: 4000
